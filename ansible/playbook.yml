---
- name: Configure K3s prerequisites 
  hosts: all
  gather_facts: false

  tasks:
    - name: Configure firewalld for Kubernetes
      become: true
      block:
        - name: Allow Kubernetes API server
          ansible.posix.firewalld:
            port: 6443/tcp
            permanent: true
            state: enabled
            immediate: true

        - name: Trust Kubernetes pod network
          ansible.posix.firewalld:
            zone: trusted
            source: 10.42.0.0/16
            permanent: true
            state: enabled
            immediate: true

        - name: Trust Kubernetes service network
          ansible.posix.firewalld:
            zone: trusted
            source: 10.43.0.0/16
            permanent: true
            state: enabled
            immediate: true

    - name: Set unique hostname
      become: true
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"
